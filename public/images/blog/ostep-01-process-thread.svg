<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'PingFang TC','Noto Sans TC','Heiti TC',system-ui,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .frame{fill:#fafafa;stroke:#a3a3a3;stroke-width:1.5}
    .mem{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
    .thr{fill:#ffedd5;stroke:#f97316;stroke-width:1.5}
    .t{fill:#171717}
    .m{fill:#525252}
    .ln{stroke:#737373;stroke-width:1.5;fill:none}
    .ah{fill:#737373}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0a0a0a}
      .frame{fill:#171717;stroke:#525252}
      .mem{fill:#172554;stroke:#60a5fa}
      .thr{fill:#431407;stroke:#fb923c}
      .t{fill:#f5f5f5}
      .m{fill:#a3a3a3}
      .ln{stroke:#a3a3a3}
      .ah{fill:#a3a3a3}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="420" rx="12"/>

  <!-- 左：兩個 process -->
  <text class="t" x="205" y="32" text-anchor="middle" font-size="16" font-weight="700">兩個 process</text>
  <text class="m" x="205" y="52" text-anchor="middle" font-size="12">（兩棟大樓）</text>

  <rect class="frame" x="30" y="66" width="165" height="290" rx="10"/>
  <text class="t" x="112" y="90" text-anchor="middle" font-size="14" font-weight="700">Process A</text>
  <rect class="mem" x="42" y="102" width="141" height="140" rx="8"/>
  <text class="t" x="112" y="160" text-anchor="middle" font-size="14">自己的記憶體</text>
  <text class="m" x="112" y="182" text-anchor="middle" font-size="12">程式碼、資料、heap</text>
  <rect class="thr" x="42" y="258" width="141" height="84" rx="8"/>
  <text class="t" x="112" y="292" text-anchor="middle" font-size="14">1 個 thread</text>
  <text class="m" x="112" y="314" text-anchor="middle" font-size="12">自己的 stack</text>

  <rect class="frame" x="215" y="66" width="165" height="290" rx="10"/>
  <text class="t" x="297" y="90" text-anchor="middle" font-size="14" font-weight="700">Process B</text>
  <rect class="mem" x="227" y="102" width="141" height="140" rx="8"/>
  <text class="t" x="297" y="160" text-anchor="middle" font-size="14">自己的記憶體</text>
  <text class="m" x="297" y="182" text-anchor="middle" font-size="12">程式碼、資料、heap</text>
  <rect class="thr" x="227" y="258" width="141" height="84" rx="8"/>
  <text class="t" x="297" y="292" text-anchor="middle" font-size="14">1 個 thread</text>
  <text class="m" x="297" y="314" text-anchor="middle" font-size="12">自己的 stack</text>

  <text class="m" x="205" y="388" text-anchor="middle" font-size="13">預設記憶體各自獨立，互相看不到</text>

  <!-- 右：一個 process、兩個 thread -->
  <text class="t" x="595" y="32" text-anchor="middle" font-size="16" font-weight="700">一個 process、兩個 thread</text>
  <text class="m" x="595" y="52" text-anchor="middle" font-size="12">（同一棟大樓裡的兩個室友）</text>

  <rect class="frame" x="420" y="66" width="350" height="290" rx="10"/>
  <text class="t" x="595" y="90" text-anchor="middle" font-size="14" font-weight="700">Process C</text>
  <rect class="mem" x="434" y="102" width="322" height="106" rx="8"/>
  <text class="t" x="595" y="145" text-anchor="middle" font-size="14">共用的記憶體</text>
  <text class="m" x="595" y="168" text-anchor="middle" font-size="12">程式碼、全域變數、heap：兩個 thread 都看得到</text>

  <rect class="thr" x="434" y="250" width="152" height="92" rx="8"/>
  <text class="t" x="510" y="282" text-anchor="middle" font-size="14">Thread 1</text>
  <text class="m" x="510" y="304" text-anchor="middle" font-size="12">各自使用的 stack</text>
  <text class="m" x="510" y="322" text-anchor="middle" font-size="12">自己執行到哪一行</text>

  <rect class="thr" x="604" y="250" width="152" height="92" rx="8"/>
  <text class="t" x="680" y="282" text-anchor="middle" font-size="14">Thread 2</text>
  <text class="m" x="680" y="304" text-anchor="middle" font-size="12">各自使用的 stack</text>
  <text class="m" x="680" y="322" text-anchor="middle" font-size="12">自己執行到哪一行</text>

  <path class="ln" d="M510,248 L510,212" marker-end="url(#a)"/>
  <path class="ln" d="M680,248 L680,212" marker-end="url(#a)"/>
  <text class="m" x="595" y="234" text-anchor="middle" font-size="11">stack 也在同一個位址空間裡</text>

  <text class="m" x="595" y="388" text-anchor="middle" font-size="13">溝通方便，但同時改同一份資料就可能出錯</text>
</svg>
