<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'PingFang TC','Noto Sans TC','Heiti TC',system-ui,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .user{fill:#eff6ff}
    .kern{fill:#f5f5f5}
    .box{fill:#ffffff;stroke:#a3a3a3;stroke-width:1.5}
    .boxa{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
    .boxk{fill:#e5e5e5;stroke:#737373;stroke-width:1.5}
    .t{fill:#171717}
    .m{fill:#525252}
    .ln{stroke:#525252;stroke-width:1.8;fill:none}
    .bd{stroke:#737373;stroke-width:1.5;stroke-dasharray:6 5}
    .ah{fill:#525252}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0a0a0a}
      .user{fill:#0f1a2e}
      .kern{fill:#171717}
      .box{fill:#0a0a0a;stroke:#525252}
      .boxa{fill:#172554;stroke:#60a5fa}
      .boxk{fill:#262626;stroke:#a3a3a3}
      .t{fill:#f5f5f5}
      .m{fill:#a3a3a3}
      .ln{stroke:#d4d4d4}
      .bd{stroke:#a3a3a3}
      .ah{fill:#d4d4d4}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="400" rx="12"/>

  <!-- 兩個區域 -->
  <rect class="user" x="20" y="20" width="760" height="170" rx="10"/>
  <rect class="kern" x="20" y="210" width="760" height="170" rx="10"/>
  <text class="t" x="40" y="46" font-size="14" font-weight="700">user mode</text>
  <text class="m" x="40" y="66" font-size="12">一般程式：不能任意執行特權操作</text>
  <text class="t" x="40" y="236" font-size="14" font-weight="700">kernel mode</text>
  <text class="m" x="40" y="256" font-size="12">kernel：可以執行特權操作、管理資源</text>

  <line class="bd" x1="20" y1="200" x2="780" y2="200"/>
  <text class="m" x="400" y="196" text-anchor="middle" font-size="12">權限邊界（由 OS 配合 CPU 硬體落實）</text>

  <!-- ① -->
  <rect class="boxa" x="150" y="88" width="240" height="70" rx="8"/>
  <text class="t" x="270" y="116" text-anchor="middle" font-size="14">① 程式呼叫 read()</text>
  <text class="m" x="270" y="138" text-anchor="middle" font-size="12">C 函式庫放好編號和參數</text>

  <!-- ③ -->
  <rect class="boxk" x="330" y="282" width="270" height="76" rx="8"/>
  <text class="t" x="465" y="311" text-anchor="middle" font-size="14">③ kernel 依編號選擇服務</text>
  <text class="m" x="465" y="334" text-anchor="middle" font-size="12">檢查參數和權限，再去執行</text>

  <!-- ⑤ -->
  <rect class="boxa" x="520" y="88" width="240" height="70" rx="8"/>
  <text class="t" x="640" y="116" text-anchor="middle" font-size="14">⑤ 拿到結果，繼續執行</text>
  <text class="m" x="640" y="138" text-anchor="middle" font-size="12">回到 user mode</text>

  <!-- ② trap -->
  <path class="ln" d="M270,160 L270,320 L326,320" marker-end="url(#a)"/>
  <text class="t" x="282" y="230" font-size="13">② trap</text>
  <text class="m" x="282" y="250" font-size="12">切到 kernel mode，</text>
  <text class="m" x="282" y="268" font-size="12">跳到固定入口</text>

  <!-- ④ return -->
  <path class="ln" d="M602,320 L700,320 L700,162" marker-end="url(#a)"/>
  <text class="t" x="688" y="230" text-anchor="end" font-size="13">④ return-from-trap</text>
  <text class="m" x="688" y="250" text-anchor="end" font-size="12">切回 user mode</text>
</svg>
