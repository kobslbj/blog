<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'PingFang TC','Noto Sans TC','Heiti TC',system-ui,sans-serif">
  <style>
    .bg{fill:#ffffff}
    .box{fill:#fafafa;stroke:#a3a3a3;stroke-width:1.5}
    .vol{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
    .safe{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
    .t{fill:#171717}
    .m{fill:#525252}
    .w{fill:#b91c1c}
    .g{fill:#15803d}
    .ln{stroke:#525252;stroke-width:1.8;fill:none}
    .dl{stroke:#525252;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .ah{fill:#525252}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0a0a0a}
      .box{fill:#171717;stroke:#525252}
      .vol{fill:#450a0a;stroke:#f87171}
      .safe{fill:#052e16;stroke:#4ade80}
      .t{fill:#f5f5f5}
      .m{fill:#a3a3a3}
      .w{fill:#fca5a5}
      .g{fill:#86efac}
      .ln{stroke:#d4d4d4}
      .dl{stroke:#d4d4d4}
      .ah{fill:#d4d4d4}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="800" height="384" rx="12"/>

  <text class="t" x="400" y="32" text-anchor="middle" font-size="16" font-weight="700">資料從程式到「斷電後還在」，要經過好幾層</text>

  <!-- 方塊 -->
  <rect class="box" x="20" y="120" width="120" height="84" rx="8"/>
  <text class="t" x="80" y="158" text-anchor="middle" font-size="14">你的程式</text>
  <text class="m" x="80" y="180" text-anchor="middle" font-size="12">記憶體裡的資料</text>

  <rect class="vol" x="200" y="120" width="170" height="84" rx="8"/>
  <text class="t" x="285" y="152" text-anchor="middle" font-size="14">OS 的檔案快取</text>
  <text class="m" x="285" y="172" text-anchor="middle" font-size="12">還在記憶體裡</text>
  <text class="w" x="285" y="192" text-anchor="middle" font-size="12">斷電會不見</text>

  <rect class="vol" x="440" y="120" width="150" height="84" rx="8"/>
  <text class="t" x="515" y="152" text-anchor="middle" font-size="14">裝置自己的快取</text>
  <text class="m" x="515" y="172" text-anchor="middle" font-size="12">硬碟內部的暫存</text>
  <text class="w" x="515" y="192" text-anchor="middle" font-size="12">斷電可能不見</text>

  <rect class="safe" x="660" y="120" width="120" height="84" rx="8"/>
  <text class="t" x="720" y="158" text-anchor="middle" font-size="14">非揮發性儲存</text>
  <text class="g" x="720" y="180" text-anchor="middle" font-size="12">斷電後還在</text>

  <!-- 主流程箭頭與標籤 -->
  <path class="ln" d="M142,162 L196,162" marker-end="url(#a)"/>
  <text class="t" x="170" y="96" text-anchor="middle" font-size="13" font-family="ui-monospace,Menlo,monospace">write()</text>
  <text class="m" x="170" y="112" text-anchor="middle" font-size="11">交給 OS</text>

  <path class="ln" d="M372,162 L436,162" marker-end="url(#a)"/>
  <text class="t" x="405" y="96" text-anchor="middle" font-size="13" font-family="ui-monospace,Menlo,monospace">fsync()</text>
  <text class="m" x="405" y="112" text-anchor="middle" font-size="11">macOS 上仍可能留在裝置快取</text>

  <path class="ln" d="M592,162 L656,162" marker-end="url(#a)"/>
  <text class="t" x="625" y="96" text-anchor="middle" font-size="13" font-family="ui-monospace,Menlo,monospace">F_FULLFSYNC</text>
  <text class="m" x="625" y="112" text-anchor="middle" font-size="11">同步檔案並要求裝置落盤</text>

  <!-- cat 讀取 -->
  <rect class="box" x="200" y="252" width="170" height="56" rx="8"/>
  <text class="t" x="285" y="278" text-anchor="middle" font-size="14">別的程式（cat）</text>
  <text class="m" x="285" y="297" text-anchor="middle" font-size="12">write 之後就可能讀得到</text>
  <path class="dl" d="M285,206 L285,248" marker-end="url(#a)"/>

  <text class="m" x="400" y="340" text-anchor="middle" font-size="12">簡化示意，以 macOS 為例：F_FULLFSYNC 會做 fsync 的工作再要求裝置落盤；Linux 的 fsync 語意不同</text>
  <text class="m" x="400" y="362" text-anchor="middle" font-size="12">沒有呼叫 fsync，OS 也會在之後自己寫下去；實際能保證什麼，要看平台和整個存檔流程</text>
</svg>
